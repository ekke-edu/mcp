name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to finish publishing (for example v0.2.2)
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/setup@v3
        with:
          version: 11.25.0
          runtime: node@24
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Verify tag matches package version
        run: test "v$(node -p 'require("./package.json").version')" = "$RELEASE_TAG"
      - run: pnpm build
      - run: pnpm test
      - name: Publish to npm with trusted publishing
        run: |
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          if npm view "ekke-mcp@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "ekke-mcp@$PACKAGE_VERSION is already published; skipping npm publish."
          else
            npm publish
          fi
      - run: mkdir -p release-assets
      - run: pnpm pack --pack-destination release-assets
      - name: Prepare GitHub Packages copy
        run: |
          mkdir github-package
          tar -xzf release-assets/*.tgz -C github-package --strip-components=1
          node <<'NODE'
          const fs = require('node:fs');
          const packagePath = 'github-package/package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          pkg.name = '@ekke-edu/ekke-mcp';
          fs.writeFileSync(packagePath, JSON.stringify(pkg, null, 2) + '\n');
          NODE
      - name: Publish to GitHub Packages
        working-directory: github-package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\\n' '@ekke-edu:registry=https://npm.pkg.github.com' '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > .npmrc
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          if npm view "@ekke-edu/ekke-mcp@$PACKAGE_VERSION" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "@ekke-edu/ekke-mcp@$PACKAGE_VERSION is already published; skipping GitHub Packages publish."
          else
            npm publish --registry=https://npm.pkg.github.com --access public
          fi
      - name: Create GitHub Release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/*.tgz --clobber
          else
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes release-assets/*.tgz
          fi
