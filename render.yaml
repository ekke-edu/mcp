services:
  - type: web
    name: ekke-mcp-chat
    runtime: node
    plan: free
    region: frankfurt
    rootDir: chat
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
